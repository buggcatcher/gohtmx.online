<div class="window-overlay" 
     x-show="terminal.show" 
     :style="'left: ' + terminal.px + 'px; top: ' + terminal.py + 'px; width: 780px;'"
     style="display: none;">
    <div class="window-header" @mousedown="dragWindow($event, terminal)">
        <span>Terminale di Sistema</span>
        <button class="close-btn" @click="terminal.show = false"></button>
    </div>
    <div class="window-body" style="padding: 0; background: #000;">
        <div class="terminal-body" id="terminal-screen" @click="$refs.termInput.focus()">
            <div style="color: #888; margin-bottom: 8px;">Solar OS [Version 2.0.42]</div>
            <div style="color: #888; margin-bottom: 12px;">Digita 'help' per la lista dei comandi disponibili.</div>
            
            <template x-for="line in terminal.history">
                <div style="margin-bottom: 4px;">
                    <span style="white-space: pre-wrap;" x-html="line"></span>
                </div>
            </template>
            
            <div class="terminal-input-line">
                <span class="terminal-prompt">user@solar:~$</span>
                <input type="text" 
                       x-ref="termInput"
                       x-model="terminal.input" 
                       @keydown.enter="runTerminalCommand()" 
                       class="terminal-input" />
            </div>
        </div>
    </div>
</div>
