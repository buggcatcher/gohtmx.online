<div class="window-overlay" 
     x-show="viewer.show" 
     @contextmenu.stop
     :style="isMobile 
        ? 'position: fixed; left: 0px; top: 50px; width: 100%; height: calc(100% - 50px); border-radius: 0;' 
        : 'position: absolute; left: ' + viewer.px + 'px; top: ' + viewer.py + 'px; width: 760px; height: 500px;'"
     style="display: none;">
    <div class="window-header" @mousedown="dragWindow($event, viewer)">
        <span x-text="t('viewer_title') + ' - ' + (viewer.targetFile ? viewer.targetFile.name : '')"></span>
        <button class="close-btn" @click="viewer.show = false" @mousedown.stop @touchstart.stop></button>
    </div>
    <div class="window-body" 
         :style="isMobile ? 'padding: 15px;' : 'padding: 25px;'"
         style="background: #1a1a24;">
        
        <!-- Render di file plain-text (.txt) senza parsing markdown -->
        <template x-if="viewer.targetFile && viewer.targetFile.name.toLowerCase().endsWith('.txt')">
            <pre style="white-space: pre-wrap; font-family: 'Courier New', Courier, monospace; color: #e6edf3; margin: 0; background: #0e0e15; padding: 15px; border-radius: 6px; border: 1px solid #30363d; overflow: auto; height: 100%; box-sizing: border-box;" 
                 x-text="viewer.targetFile.content"></pre>
        </template>
        
        <!-- Render di file markdown (.md) con parsing standard -->
        <template x-if="viewer.targetFile && !viewer.targetFile.name.toLowerCase().endsWith('.txt')">
            <div class="markdown-preview" x-html="parseMarkdown(viewer.targetFile ? viewer.targetFile.content : '')"></div>
        </template>
        
    </div>
</div>
