<div class="window-overlay" 
     x-show="viewer.show" 
     @contextmenu.stop
     :style="isMobile 
        ? 'position: fixed; left: 0px; top: 50px; width: 100%; height: calc(100% - 50px); border-radius: 0;' 
        : 'position: absolute; left: ' + viewer.px + 'px; top: ' + viewer.py + 'px; width: 760px; height: 500px;'"
     style="display: none;">
    <div class="window-header" @mousedown="dragWindow($event, viewer)">
        <span x-text="'Visualizzatore - ' + (viewer.targetFile ? viewer.targetFile.name : '')"></span>
        <button class="close-btn" @click="viewer.show = false" @mousedown.stop @touchstart.stop></button>
    </div>
    <div class="window-body" 
         :style="isMobile ? 'padding: 15px;' : 'padding: 25px;'"
         style="background: #1a1a24;">
        <div class="markdown-preview" x-html="parseMarkdown(viewer.targetFile ? viewer.targetFile.content : '')"></div>
    </div>
</div>
