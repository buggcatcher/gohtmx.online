<div class="window-overlay" 
     x-show="viewer.show" 
     :style="isMobile 
        ? 'left: 0px; top: 50px; width: 100%; height: calc(100% - 50px); border-radius: 0;' 
        : 'left: ' + viewer.px + 'px; top: ' + viewer.py + 'px; width: 760px;'"
     style="display: none;">
    <div class="window-header" @mousedown="dragWindow($event, viewer)">
        <span x-text="'Visualizzatore - ' + (viewer.targetFile ? viewer.targetFile.name : '')"></span>
        <button class="close-btn" @click="viewer.show = false"></button>
    </div>
    <div class="window-body" 
         :style="isMobile ? 'height: calc(100% - 42px); padding: 15px;' : 'height: 440px; padding: 25px;'"
         style="overflow-y: auto; background: #1a1a24; box-sizing: border-box;">
        <div class="markdown-preview" x-html="parseMarkdown(viewer.targetFile ? viewer.targetFile.content : '')"></div>
    </div>
</div>
