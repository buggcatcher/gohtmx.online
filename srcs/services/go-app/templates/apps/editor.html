<div class="window-overlay" 
     x-show="editor.show" 
     @contextmenu.stop
     :style="isMobile 
        ? 'position: fixed; left: 0px; top: 42px; width: 100%; height: calc(100% - 42px); border-radius: 0;' 
        : 'position: absolute; left: ' + editor.px + 'px; top: ' + editor.py + 'px; width: 680px; height: 440px;'"
     style="display: none;">
    <div class="window-header" @mousedown="dragWindow($event, editor)">
        <span x-text="t('editor_title') + ' - ' + (editor.targetFile ? editor.targetFile.name : '')"></span>
        <button class="close-btn" @click="editor.show = false" @mousedown.stop @touchstart.stop></button>
    </div>
    <div class="window-body" 
         style="display: flex; flex-direction: column; justify-content: space-between; padding: 15px; background: #1a1a24;">
        <textarea x-model="editor.tempContent" 
                  :readonly="isGuest || (editor.targetFile && editor.targetFile.id === 'readme')" 
                  style="flex: 1; width: 100%; min-height: 200px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; padding: 8px; resize: none; font-family: monospace; box-sizing: border-box;"></textarea>
        
        <div style="display: flex; justify-content: flex-start; align-items: center; margin-top: 10px; min-height: 32px;">
            <button class="btn-access" 
                    x-show="!isGuest && (editor.targetFile && editor.targetFile.id !== 'readme')" 
                    @click="saveFile()" 
                    style="font-size: 0.9rem; padding: 6px 15px; border-radius: 6px; box-shadow: none;" x-text="t('save_changes')"></button>
            
            <div x-show="isGuest || (editor.targetFile && editor.targetFile.id === 'readme')" 
                 style="font-size: 0.85rem; color: #ff5f56; font-family: sans-serif; display: flex; align-items: center; gap: 6px;">
                <span x-text="editor.targetFile && editor.targetFile.id === 'readme' ? t('read_only_sys') : t('read_only_guest')"></span>
            </div>
        </div>
    </div>
</div>
