<div class="desktop-workspace" 
     x-data="desktopManager('{{.Username}}', {{.IsGuest}}, '{{.Lang}}')"
     @contextmenu.prevent="showContextMenu($event, null)"
     @touchstart="handleTouchStart($event, null)"
     @touchend="handleTouchEnd()"
     @touchmove="handleTouchEnd()"
     @dragover.prevent="!isGuest && (dragOver = true)"
     @dragleave.prevent="dragOver = false"
     @drop.prevent="handleDrop($event)"
     :class="{ 'drag-active': dragOver }">
    
    <div class="top-navbar">
        <span class="nav-logo">Solar City</span>
        
        <!-- Menu Utente Minimale -->
        <div class="dropdown-container" x-data="{ openMenu: false }">
            <span class="nav-user" @click="openMenu = !openMenu" x-text="isGuest ? (t('guest_session') + ' ▼') : (t('user_session') + ': ' + currentUser + ' ▼')"></span>
            <div class="dropdown-menu" x-show="openMenu" @click.away="openMenu = false" style="display: none; width: 280px;">
                <div class="dropdown-header" x-text="isGuest ? t('guest_session') : t('user_session')"></div>
                
                <!-- Horizontal Language Switcher inside Dropdown -->
                <div style="display: flex; gap: 4px; justify-content: center; padding: 8px 0; border-bottom: 1px dashed rgba(255,255,255,0.15); width: 100%; overflow: hidden; box-sizing: border-box;">
                    <template x-for="langId in ['it', 'hr', 'fr', 'es', 'de', 'uk', 'cn', 'jp']">
                        <button type="button" 
                                @click="changeLanguage(langId)" 
                                style="background: transparent !important; -webkit-appearance: none !important; -moz-appearance: none !important; appearance: none !important; font-size: 1.1rem; cursor: pointer; padding: 2px !important; margin: 0 !important; transition: transform 0.2s; display: inline-flex; align-items: center; justify-content: center; border-radius: 0px !important; box-shadow: none !important; width: 28px; height: 22px; box-sizing: border-box !important;"
                                :style="activeLang === langId 
                                    ? 'border: 1px solid var(--accent-color) !important; background: rgba(0, 255, 204, 0.15) !important; opacity: 1;' 
                                    : 'border: 1px solid rgba(255, 255, 255, 0.15) !important; background: rgba(0, 0, 0, 0.4) !important; opacity: 0.6;'"
                                :title="langId.toUpperCase()">
                            <span x-text="translationDictionary[langId].flagSymbol" style="line-height: 1; display: inline-block;"></span>
                        </button>
                    </template>
                </div>

                <div style="padding: 12px; font-family: monospace; font-size: 0.8rem; line-height: 1.6;">
                    <p style="margin: 0 0 6px 0;"><span style="color: #00ffcc;" x-text="t('active_ip')"></span> <span x-text="userIP"></span></p>
                    <p style="margin: 0 0 12px 0;"><span style="color: #00ffcc;" x-text="t('session_time')"></span> <span x-text="formatSessionTime()"></span></p>
                    
                    <div style="border-top: 1px dashed rgba(255, 255, 255, 0.15); padding-top: 12px; display: flex; justify-content: center;">
                        <template x-if="isGuest">
                            <a href="/" class="btn-primary" style="display: block; text-align: center; text-decoration: none; width: 100%; padding: 8px 12px; font-size: 0.85rem; box-sizing: border-box;" x-text="t('login') + ' / ' + t('register')">
                            </a>
                        </template>
                        <template x-if="!isGuest">
                            <a href="/logout" class="btn-primary" style="display: block; text-align: center; text-decoration: none; width: 100%; padding: 8px 12px; font-size: 0.85rem; box-sizing: border-box; background-color: #ff5f56; color: white; box-shadow: 0 0 10px rgba(255, 95, 86, 0.4);" x-text="t('logout')">
                            </a>
                        </template>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Griglia dei File -->
    <div class="desktop-grid" @click="contextMenu.show = false">
        <template x-for="file in files" :key="file.id">
            <div class="desktop-icon" 
                 @dblclick="openFile(file)"
                 @contextmenu.prevent.stop="showContextMenu($event, file)"
                 @touchstart.stop="handleTouchStart($event, file)"
                 @touchend.stop="handleTouchEnd()"
                 @touchmove.stop="handleTouchEnd()">
                <div class="icon-symbol" style="display: flex; align-items: center; justify-content: center; min-height: 48px;">
                    <template x-if="file.icon.includes('/') || file.icon.includes('.')">
                        <img :src="file.icon" style="width: 48px; height: 48px; object-fit: contain; pointer-events: none;" />
                    </template>
                    <template x-if="!file.icon.includes('/') && !file.icon.includes('.')">
                        <span x-text="file.icon" style="font-size: 2.5rem; display: block; line-height: 1;"></span>
                    </template>
                </div>
                <span x-text="file.name"></span>
            </div>
        </template>
    </div>

    <!-- Tasto Destro Menu -->
    {{template "context_menu.html" .}}

    <!-- Applicazioni desktop divise in moduli (templates/apps/) -->
    {{template "editor.html" .}}
    {{template "viewer.html" .}}
    {{template "creator.html" .}}
    {{template "terminal.html" .}}
    {{template "inspector.html" .}}
    {{template "metric.html" .}}

</div>
