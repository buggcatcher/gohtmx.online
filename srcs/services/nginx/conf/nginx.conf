server {
    listen 80;
    server_name gohtmx.online www.gohtmx.online;
    
    # serve per la convalida iniziale di let's encrypt (acme challenge)
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name gohtmx.online www.gohtmx.online;

    ssl_certificate /etc/letsencrypt/live/gohtmx.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gohtmx.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /static/ {
        alias /usr/share/nginx/html/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        proxy_pass http://go-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}